name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      MODELS_CACHE: ${{ github.workspace }}/models-cache

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache des modèles d'IA
        uses: actions/cache@v4
        with:
          path: models-cache
          key: models-${{ hashFiles('scripts/download_models.sh') }}

      - name: Téléchargement de sherpa-onnx et des modèles
        run: bash scripts/download_models.sh

      - name: Tests unitaires
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Keystore de signature
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # Secret unique SIGNING_KEY = "<mot de passe> <keystore en base64>" (alias : reunions)
          if [ -n "$SIGNING_KEY" ]; then
            PW="${SIGNING_KEY%% *}"
            KEYSTORE_BASE64="${SIGNING_KEY#* }"
            echo "::add-mask::$PW"
            echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=reunions" >> "$GITHUB_ENV"
          fi
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNATURE=release" >> "$GITHUB_ENV"
            echo "Keystore de release trouvé."
          else
            echo "SIGNATURE=debug" >> "$GITHUB_ENV"
            echo "::warning::Secret KEYSTORE_BASE64 absent : APK signé avec une clé de DEBUG (voir README)."
          fi

      - name: Compilation de l'APK release
        env:
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Repli sur les anciens secrets séparés si SIGNING_KEY n'est pas utilisé
          export KEYSTORE_PASSWORD="${KEYSTORE_PASSWORD:-$SECRET_KEYSTORE_PASSWORD}"
          export KEY_ALIAS="${KEY_ALIAS:-$SECRET_KEY_ALIAS}"
          export KEY_PASSWORD="${KEY_PASSWORD:-$SECRET_KEY_PASSWORD}"
          ./gradlew --no-daemon assembleRelease

      - name: Vérification « aucune permission réseau »
        run: bash scripts/check_no_network.sh app/build/outputs/apk/release/app-release.apk

      - name: Préparation de l'APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Reunions-hors-ligne-v${VERSION_NAME}.apk"
          ls -lh dist
          "$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)" verify --print-certs dist/*.apk | head -5

      - name: Publication GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$SIGNATURE" = "release" ]; then
            SIGN_NOTE="Signé avec la clé de release : s'installe par-dessus la version précédente."
          else
            SIGN_NOTE="⚠️ Signé avec une clé de DEBUG temporaire (secrets absents) : désinstallez avant d'installer une autre version. Voir le README pour configurer la signature."
          fi
          gh release create "v${VERSION_NAME}" dist/*.apk \
            --target "$GITHUB_SHA" \
            --title "Réunions hors ligne v${VERSION_NAME}" \
            --notes "Application Android de transcription de réunions, 100 % hors ligne.

          - Téléchargez **Reunions-hors-ligne-v${VERSION_NAME}.apk** depuis votre téléphone puis ouvrez-le.
          - ${SIGN_NOTE}
          - Commit : ${GITHUB_SHA}"

  # Test de bout en bout : la vraie transcription (APK release minifié) sur un émulateur Android.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      MODELS_CACHE: ${{ github.workspace }}/models-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache des modèles d'IA
        uses: actions/cache@v4
        with:
          path: models-cache
          key: models-${{ hashFiles('scripts/download_models.sh') }}
      - name: Modèles
        run: bash scripts/download_models.sh
      - name: Audio de test
        run: |
          mkdir -p app/src/androidTest/assets
          curl -fL --retry 5 -o /tmp/two.wav https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-segmentation-models/2-two-speakers-en.wav
          ffmpeg -loglevel error -y -i /tmp/two.wav -t 40 -ac 1 -ar 16000 -c:a pcm_s16le -map_metadata -1 -fflags +bitexact -flags:a +bitexact app/src/androidTest/assets/two.wav
          ffmpeg -loglevel error -y -i /tmp/two.wav -t 8 -ac 1 -ar 16000 -c:a pcm_s16le -map_metadata -1 -fflags +bitexact -flags:a +bitexact app/src/androidTest/assets/short.wav
          ls -l app/src/androidTest/assets; xxd app/src/androidTest/assets/short.wav | head -3
      - name: Compilation (release + tests instrumentés)
        run: ./gradlew --no-daemon -Pe2e assembleRelease assembleReleaseAndroidTest
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Émulateur Android 15 + transcription réelle
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          ram-size: 6144M
          disk-size: 8G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: bash scripts/run_e2e.sh
